          description: One of `guest`, `rep`, `flm`, `slm`, `admin`, `viewer`. Null if the user signed in but is not yet provisioned (and is not on the configured internal email domain). `guest` is a read-only role for users who chose "Continue without signing in". `viewer` is auto-assigned to logged-in internal-domain employees who are not in the Sales Hierarchy and not on the admin list — read-only org-wide access.
        hierarchyName:
          type: [string, 'null']
          description: The full name of this user as it appears in the sales hierarchy, used to look up org relationships.
        viewOnly:
          type: boolean
          description: True for stateless view-only sessions created via "Continue without signing in". These sessions cannot persist preferences or mutate any data, and may switch effective role via the `?role=` URL param.
