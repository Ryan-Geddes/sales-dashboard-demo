  /sales/goals/resolve:
    get:
      operationId: resolveGoals
      tags: [sales]
      summary: Resolve goals for one source for a month
      description: |
        Resolves a single goal source into a per-rep, per-product goal set for
        the given month (`YYYY-MM`, defaults to current). Products/metrics a
        source does not populate are absent (zero downstream). Restricted to
        admin / SLM / exec.
      parameters:
        - name: source
          in: query
          required: true
          schema:
            type: string
            enum: [financePps, goalCsv, softwareGnr, softwareAcq]
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Resolved goals
          content:
            application/json:
              schema:
                type: object
                required: [source, month, goals]
                properties:
                  source:
                    type: string
                    enum: [financePps, goalCsv, softwareGnr, softwareAcq]
                  month:
                    type: string
                  goals:
                    $ref: "#/components/schemas/ResolvedGoals"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/table:
    get:
      operationId: getGoalTable
      tags: [sales]
      summary: Get the main Goals table for the dashboard filter set
      description: |
        Returns one row per non-SLM/FLM rep × product across the five canonical
        products for `month` (`YYYY-MM`, defaults to current), narrowed by the
        optional dashboard filters. Each row carries its hierarchy attributes,
        its Source (default finance.pps) and the base goals that source resolves
        to, the per-row overrides (manual multipliers, LOA status, eRep
        multiplier), and the four computed Final goal columns. Restricted to
        admin / SLM / exec.
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: slm
          in: query
          required: false
          description: Filter to a single SLM by name.
          schema:
            type: string
        - name: flm
          in: query
          required: false
          description: Filter to a single FLM by name.
          schema:
            type: string
        - name: reps
          in: query
          required: false
          description: Comma-separated list of rep names to include.
          schema:
            type: string
        - name: regions
          in: query
          required: false
          description: Comma-separated list of regions to include.
          schema:
            type: string
      responses:
        "200":
          description: Goals table rows
          content:
            application/json:
              schema:
                type: object
                required: [month, rows]
                properties:
                  month:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoalTableRow"
  /sales/goals/table/override:
    put:
      operationId: upsertGoalRowOverride
      tags: [sales]
      summary: Upsert a single Goals-table row override
      description: |
        Inserts or updates the per-(month, rep, product) override. Only the
        fields present in the body are changed; omitted fields keep their stored
        value or the code default. Restricted to admin / SLM / exec.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoalRowOverrideInput"
      responses:
        "200":
          description: Override saved
          content:
            application/json:
              schema:
                type: object
                required: [override]
                properties:
                  override:
                    $ref: "#/components/schemas/GoalRowOverride"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/table/bulk-source:
    post:
      operationId: bulkSetGoalRowSource
      tags: [sales]
      summary: Bulk-set the Source for every row in the filter set
      description: |
        Sets the goal Source for all (rep, product) rows in the current filter
        set (`month` + the optional narrowing filters supplied as query params),
        preserving any other stored per-row override values. Restricted to
        admin / SLM / exec.
      parameters:
        - name: month
          in: query
          required: false
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: slm
          in: query
          required: false
          schema:
            type: string
        - name: flm
          in: query
          required: false
          schema:
            type: string
        - name: reps
          in: query
          required: false
          schema:
            type: string
        - name: regions
          in: query
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source]
              properties:
                source:
                  $ref: "#/components/schemas/GoalSourceId"
      responses:
        "200":
          description: Bulk source applied
          content:
            application/json:
              schema:
                type: object
                required: [month, updated, source]
                properties:
                  month:
                    type: string
                  updated:
                    type: integer
                  source:
                    $ref: "#/components/schemas/GoalSourceId"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sheets/fetch:
    get:
      operationId: fetchSheet
      tags: [sheets]
      summary: Fetch a Google Sheet as CSV via server-side proxy
      parameters:
        - name: url
          in: query
          required: true
          schema:
            type: string
          description: Full Google Sheets URL
      responses:
        "200":
          description: CSV content of the sheet
          content:
            text/csv:
              schema:
                type: string
        "400":
          description: Invalid or missing URL
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "502":
          description: Could not fetch the sheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /sales/roster:
    get:
      operationId: getRoster
      tags: [sales]
      summary: List the editable roster for a month
      description: |
        Every person in the base hierarchy (active AND inactive) with their
        base hierarchy values, the per-month overrides, and the resolved
        effective values. Executive-view roles only.
      parameters:
        - name: month
          in: query
          required: false
          description: Month in `YYYY-MM` format. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Roster rows for the month
          content:
            application/json:
              schema:
                type: object
                required: [month, rows]
                properties:
                  month:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterPersonRow"
        "400":
          description: Invalid `month` parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /sales/roster/override:
    put:
      operationId: upsertRosterOverride
      tags: [sales]
      summary: Upsert a single person's roster override for a month
      description: |
        Sets per-month hierarchy overrides for one person (Active, FLM,
        SLM, region, segment, sales role). Only the provided fields change;
        send `null` to clear a field's override. Strictly month-scoped and
        never carried forward. Returns the refreshed roster for the month.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [month, person]
              properties:
                month:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                person:
                  type: string
                active:
                  type: boolean
                  nullable: true
                flm:
                  type: string
                  nullable: true
                slm:
                  type: string
                  nullable: true
                region:
                  type: string
                  nullable: true
                segment:
                  type: string
                  nullable: true
                salesRole:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Override saved; refreshed roster for the month
          content:
            application/json:
              schema:
                type: object
                required: [month, rows]
                properties:
                  month:
                    type: string
                  rows:
                    type: array
                    items:
                      $ref: "#/components/schemas/RosterPersonRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SalesConfig:
      type: object
      required:
        - org
        - segments
        - regions
        - groups
        - products
      properties:
        org:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: array
              items:
                type: string
        segments:
          type: array
          items:
            type: string
        regions:
          type: array
          items:
            type: string
        groups:
          type: array
          items:
            type: string
        acqSlms:
          type: array
          description: |
            SLMs whose subtree belongs to the Acquisitions channel, derived
            from each rep's data-driven channel (no hardcoded names, demo-safe).
          items:
            type: string
        demoProductLabels:
          type: object
          description: |
            Present only in DEMO_MODE: canonical internal product name ->
            demo-facing display label. The frontend translates product names
            and abbreviations at render time; engine data stays canonical.
          additionalProperties:
            type: object
            required:
              - name
              - abbrev
            properties:
              name:
                type: string
              abbrev:
                type: string
        products:
          type: array
          items:
            type: string
        types:
          type: array
          items:
            type: string
        salesRoles:
          type: array
          items:
            type: string
        quoteTypes:
          type: array
          items:
            type: string
        rawProducts:
          type: array
          description: |
            Task #361: distinct raw Product values for the admin-only Conditions
            filter in the Pipeline view.
          items:
            type: string
        productFamilies:
          type: array
          description: |
            Task #361: distinct Product Family values for the admin-only
            Conditions filter in the Pipeline view.
          items:
            type: string
        termLengths:
          type: array
          description: |
            Task #361: distinct Term Length values for the admin-only Conditions
            filter in the Pipeline view.
          items:
            type: string
        funnelStages:
          type: array
          description: |
            Task #361: distinct canonical Funnel Stage buckets for the
            admin-only Conditions filter in the Pipeline view.
          items:
            type: string
        mrrFields:
          type: array
          description: |
            Task #276/#314: canonical base MRR source options for the per-rule
            MRR field picker on the Compensation Rules tab. Each entry is a
            stable value (a feeder-sheet or CPD-object column) and a label.
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
                enum:
                  - changeInMrr
                  - totalMrr
                  - splitTotalPrice
                  - totalPrice
                  - amount
                  - mrr
                  - mrr_added
                  - positive_change_in_mrr
                  - negative_change_in_mrr
              label:
                type: string
        mrrFieldSources:
          type: object
          description: |
            Task #314: the mrrFields options grouped by upstream source. Feeder
            rules pick from `feeder`; CPD-pinned rules (ZMX / Showcase
            Incremental - Re/Max) pick from `cpd`. A rule may reference only one.
          required: [feeder, cpd]
          properties:
            feeder:
              type: array
              items:
                type: string
            cpd:
              type: array
              items:
                type: string
        cpdSourcedValues:
          type: array
          description: |
            Task #314: product/type values whose opps are CPD-sourced
            (Databricks). The rules UI uses these to keep a rule single-source.
          items:
            type: string

    RepPipeline:
      type: object
      required:
        - name
        - flm
        - slm
        - region
        - group
        - goal30d
        - mrr30d
        - mrr24h
        - churn30d
        - churn24h
        - mods30d
        - mods24h
        - funnel
        - productShare
        - productFunnel
      properties:
        name:
          type: string
        flm:
          type: string
        slm:
          type: string
        region:
          type: string
        group:
          type: string
        goal30d:
          type: number
        mrr30d:
          type: number
        mrr24h:
          type: number
        churn30d:
          type: number
        churn24h:
          type: number
        mods30d:
          type: number
        mods24h:
          type: number
        funnel:
          type: object
          additionalProperties:
            type: number
        productShare:
          type: object
          additionalProperties:
            type: number
        productFunnel:
          type: object
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        productMods:
          type: object
          description: Per-product sum of scheduled-mod amounts attributed to this rep within the active mods window. Used to populate Churn Forecast booked totals.
          additionalProperties:
            type: number
        productModsWeighted:
          type: object
          description: Per-product weighted scheduled-mod amounts (each mod multiplied by its effective probability — per-mod override or the Scheduled Mods stage default). Used to populate Churn Forecast weighted totals.
          additionalProperties:
            type: number
        productModsCount:
          type: object
          description: Per-product count of deduped scheduled-mod rows attributed to this rep within the active mods window. Used to display the "N mods" badge on the Churn Forecast popup.
          additionalProperties:
            type: number
        productChurnTypeMods:
          type: object
          description: Per-product × per-churn-type sum of scheduled-mod amounts. Excludes Manager Estimate contributions (ME has its own pinned row). Used by the per-Churn-Type rows in the GNR Churn Forecast popup.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        productChurnTypeModsWeighted:
          type: object
          description: Per-product × per-churn-type weighted scheduled-mod amounts (each mod multiplied by its effective probability — per-mod override or the per-churn-type stage default).
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        productChurnTypeModsCount:
          type: object
          description: Per-product × per-churn-type count of deduped scheduled-mod rows.
          additionalProperties:
            type: object
            additionalProperties:
              type: number
        cwByMonth:
          type: object
          description: Per-rep per-calendar-month Closed Won bucket (Task #159 quota proration). Keys are "YYYY-MM"; values carry the CW measurement variants the client switches between (`added`, `acqNet`, `std`).
          additionalProperties:
            $ref: "#/components/schemas/CwBucket"
        productCwByMonth:
          type: object
          description: Per-rep per-product per-calendar-month Closed Won. Outer key product, inner key "YYYY-MM".
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CwBucket"
        cwMtd:
          description: Per-rep current-month Closed Won restricted to closeDate <= today (PST). Used to subtract already-booked CW from monthly_goal before applying the business-day proration factor.
          $ref: "#/components/schemas/CwBucket"
        productCwMtd:
          type: object
          description: Per-rep per-product current-month Closed Won restricted to closeDate <= today (PST).
          additionalProperties:
            $ref: "#/components/schemas/CwBucket"
        cwDaysByMonth:
          type: object
          description: Sparse per-day Closed Won keyed by "YYYY-MM" then by day-of-month ("1".."31"). Lets the client compute exact subtractable amounts for partial-month boundaries in custom date ranges. Sums across the full month equal cwByMonth.
          additionalProperties:
            type: object
            additionalProperties:
              $ref: "#/components/schemas/CwBucket"
        productCwDaysByMonth:
          type: object
          description: Sparse per-product per-day Closed Won. Outer key product, then "YYYY-MM", then day-of-month. Sums across the full month equal productCwByMonth.
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              additionalProperties:
                $ref: "#/components/schemas/CwBucket"

    CwBucket:
      type: object
      description: Closed-won amount aggregated under each of the measurement modes the Pipeline view supports. `std` is the standard CW total.
      required:
        - added
        - acqNet
        - std
      properties:
        added:
          type: number
        acqNet:
          type: number
        std:
          type: number

    PipelineData:
      type: object
      required:
        - reps
        - quotaDataAvailable
      properties:
        reps:
          type: array
          items:
            $ref: "#/components/schemas/RepPipeline"
        quotaDataAvailable:
          type: boolean
          description: True when the *selected* month's quotas were populated by Anaplan. False means the selected month's quota upload hasn't landed yet (typically the first few days of a month before the ~5th-of-month publish). The UI should still render the quota card normally and only show a small "not yet published" indicator — other months in the date range may still have valid quotas.
        quotaError:
          type: boolean
          description: True when the upstream quota query failed or timed out. When true, all rep quotas are returned as zeros and the UI should show a fetch warning rather than the "not yet published" indicator.
        quotaErrorMessage:
          type: string

    RepActivity:
      type: object
      required:
        - name
        - flm
        - slm
        - region
        - group
        - dials30d
        - dials24h
        - convos30d
        - convos24h
        - talk30d
        - talk24h
        - emails30d
        - emails24h
        - sbrs30d
        - sbrs24h
        - opps30d
        - opps24h
      properties:
        name:
          type: string
        flm:
          type: string
        slm:
          type: string
        region:
          type: string
        group:
          type: string
        dials30d:
          type: number
        dials24h:
          type: number
        convos30d:
          type: number
        convos24h:
          type: number
        talk30d:
          type: number
        talk24h:
          type: number
        emails30d:
          type: number
        emails24h:
          type: number
        sbrs30d:
          type: number
