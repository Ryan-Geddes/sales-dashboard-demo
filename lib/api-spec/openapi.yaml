          type: number
        splitTotalPrice:
          type: number
        totalPrice:
          type: number
        amount:
          type: number
        mrr:
          type: number

    AnaplanLineItem:
      type: object
      required:
        - product
        - compensableMrr
        - rep
        - group
        - outOfChannel
        - ruleNames
        - multipliers
        - rawMrr
        - baseMrrField
        - effectiveMrrField
        - mrrFieldRuleLabels
        - productLogicLabel
        - excludedByAcqChurn
      properties:
        product:
          type: string
        compensableMrr:
          type: number
        rep:
          type: string
          description: |
            The line item's owner (effective rep after any comp
            owner-reassignment), so a multi-owner opportunity can show every
            line beside its owner name — even owners outside the opp's
            attributed channel.
        group:
          type: string
          description: The owner's effective channel/group (post owner-reassignment).
        outOfChannel:
          type: boolean
          description: |
            True when this line item belongs to a different channel than the opp
            line it is shown under. Out-of-channel lines are displayed for
            context (with their owner name) but DO NOT add to the opp's
            compensableMrr total unless a compensation/product rule reassigns the
            credit into this channel.
        excludedByAcqChurn:
          type: boolean
          description: |
            True when this line is an Acquisitions-channel churn line item that
            the Acquisition churn gate drops from Quota Target MRR (a negative
            Closed Won line with no paired positive Closed Won for the same
            rep/account/product this month). Its compensableMrr is forced to 0
            so the Anaplan total reconciles to the Pipeline acqNet total; the UI
            renders it red.
        acqChurnOverridden:
          type: boolean
          description: |
            True when this line WOULD have been dropped by the Acquisition
            churn gate but an "Ignore ACQ Churn Logic" paired-rule adjustment
            flagged its opp to bypass the gate, so its churn counts toward
            Quota Target MRR anyway.
        ruleNames:
          type: array
          items:
            type: string
        multipliers:
          type: array
          items:
            type: number
        pairAdjustmentLabel:
          type: string
          nullable: true
          description: |
            Paired-opp adjustment label for this line's side (e.g.
            "zpro: × 0.1", "fub: waived"), mirroring the drilldown's
            Multipliers column text. Null when the line is not part of a
            fired pair.
        rawMrr:
          $ref: "#/components/schemas/AnaplanRawMrr"
        baseMrrField:
          type: string
          description: |
            The feeder MrrField the engine's Type-driven product logic uses as
            the base compensable MRR for this line (no rule override). Blank for
            CPD-sourced rows whose MRR comes from Databricks, not a feeder column.
        effectiveMrrField:
          type: string
          description: |
            The feeder MrrField actually used after rule overrides — equals
            baseMrrField unless a rule's MRR-field override won.
        mrrFieldWinner:
          type: string
          nullable: true
          description: Label of the rule whose MRR-field override applied (null when the default field was used).
        mrrFieldRuleLabels:
          type: array
          items:
            type: string
          description: Labels of every matching MRR-field-setting rule (length > 1 means conflicting field rules).
        productLogicLabel:
          type: string
          description: |
            Label of the Product Logic rule (first-match, top-down) that
            selected this line's base MRR field. Blank when no rule matched
            (legacy passthrough).
        productLogicNumber:
          type: integer
          nullable: true
          description: |
            1-based position of the matched Product Logic rule in the active
            rule list (mirrors the Product Logic tab's numbering). Null when no
            rule matched.

    AnaplanPartnerOpp:
      type: object
      description: |
        A partner opportunity that satisfied a paired-opp comp rule's trigger
        alongside the opp it is shown under (same engine pairKey). Purely
        display context for the Anaplan table's expandable pair rows — partner
        MRR is NEVER added to the CPD's Quota Target MRR or any Anaplan
        aggregate. Partner opps are often owned by other reps (e.g. an On
        Demand "V3 Cancel: waived" cancel) and absent from the CPD's own opp
        list, so they are embedded on the opp line.
      required:
        - oppId
        - oppName
        - accountId
        - rep
        - product
        - ruleLabel
        - compensableMrr
        - rawMrr
      properties:
        oppId:
          type: string
        oppName:
          type: string
        accountId:
          type: string
        rep:
          type: string
        product:
          type: string
        ruleLabel:
          type: string
          description: |
            The paired rule's label for the partner's side (e.g. "V3 Cancel: waived").
        compensableMrr:
          type: number
          description: Context-only compensable MRR of the partner rows (e.g. $0.00 waived).
        rawMrr:
          $ref: "#/components/schemas/AnaplanRawMrr"

    AnaplanOppLine:
      type: object
      required:
        - oppId
        - found
        - compensableMrr
