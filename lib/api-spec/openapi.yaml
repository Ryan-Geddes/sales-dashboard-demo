        pairRuleLabel:
          type: string
          description: Label of the paired-opp rule that paired this opp.
        pairKey:
          type: string
          description: The engine's pair-group key linking both sides of the pair.
        partnerOpps:
          type: array
          items:
            $ref: "#/components/schemas/AnaplanPartnerOpp"
          description: |
            Context-only partner opp(s) sharing this opp's pairKey (the other
            side of the pair), for the expandable pair sub-rows. Never counted
            in Quota Target MRR or any Anaplan aggregate.

