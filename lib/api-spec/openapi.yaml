          type: string
    UserPreferenceEnvelope:
      type: object
      required: [value]
      properties:
        value:
          description: Arbitrary JSON value (object, array, primitive, or null).

    Opportunity:
      type: object
      description: |
        A single open or scheduled-mod opportunity as returned by the
        sales endpoints. Mirrors the row shape produced by
        `mapRowToOpp` / `mapRowToModOpp` in the api-server.
      required:
        - oppId
        - rep
        - funnelStage
      properties:
        oppId:
          type: string
        rep:
          type: string
        accountName:
          type: string
        funnelStage:
          type: string
        product:
          type: string
        mrr:
          type: number
        rawMrr:
          type: number
          nullable: true
          description: |
            Task #246: untreated (pre-multiplier) MRR for this opp, present
            only when the response is computed in Compensable MRR mode. The
            drilldown shows this in the MRR column while `mrr` carries the
            compensable (adjusted) value.
        compMultipliers:
          type: array
          nullable: true
          description: |
            Task #246: the stacked multipliers (as decimals) applied to derive
            compensable MRR, in application order. Empty array means no
            multiplier rule matched (effective 1x). Null outside comp mode.
          items:
            type: number
        compRuleNames:
          type: array
          nullable: true
          description: |
            Task #246: human-readable names of the multiplier rules that
            matched and were stacked for this opp. Null outside comp mode.
          items:
            type: string
        pairOppName:
          type: string
          nullable: true
          description: |
            Name of the matched paired-opp rule's named opportunity this opp
            belongs to. Null when not part of a matched group or outside comp mode.
        pairKey:
          type: string
          nullable: true
          description: |
            Stable key grouping the members of one matched paired-opp group so
            the drilldown can link them. Null when not part of a group.
        pairRuleLabel:
          type: string
          nullable: true
          description: Label of the paired-opp rule that matched this opp. Null otherwise.
        pairAdjustmentLabel:
          type: string
          nullable: true
          description: 'Human-readable adjustment applied to this opp (e.g. "zpro: × 0.1"). Null otherwise.'
        churnSuppressed:
          type: boolean
          nullable: true
          description: |
            Task #317: true when this opp's churn was waived by a paired-opp
            rule (the generic replacement for cancel/rebook + FUB-cancel
            suppression). Null/false otherwise.
        ownerReassignedTo:
          type: string
          nullable: true
          description: Task #317: owner this opp's credit was reassigned to by a gated reassignOwnerToOpp adjustment. Null otherwise.
        appliedMrrField:
          type: string
          nullable: true
          enum:
            - changeInMrr
            - totalMrr
            - splitTotalPrice
            - totalPrice
            - amount
            - mrr
          description: |
            Task #276: the feeder-sheet column that fed the compensable base MRR
            for this opp — a matching rule's MRR-field override, else the
            Type-driven default. Null outside comp mode.
        mrrFieldWinner:
          type: string
          nullable: true
          description: |
            Task #276: label of the rule whose MRR-field override actually
            applied to this opp (null when no override applied, e.g. the default
            field was used). When multiple field-setting rules matched, this is
            the first (top-down) one.
        mrrFieldRuleLabels:
          type: array
          nullable: true
          description: |
            Task #276: labels of every matching MRR-field-setting rule, in
            order. Length > 1 means the opp matched conflicting field rules and
            the first one won. Null outside comp mode.
          items:
            type: string
        closeDate:
          type: string
          format: date
        probabilityOverride:
          type: number
          nullable: true
          description: Per-opportunity override of the stage default probability.
        effectiveProbability:
          type: number
          nullable: true
          description: |
            `probabilityOverride` if set, else the funnel-stage default. Used
            for weighted forecast math.
        isReviewed:
          type: boolean
          description: |
            Task #149: true iff the rep has explicitly reviewed this opp —
            i.e. an `opp_probability_overrides` row exists AND its
            `reviewed_at` is non-null. The frontend keys the yellow
            "needs review" highlight and the Unreviewed Opportunities filter
            off `!isReviewed`. The Sunday HST cron clears `reviewed_at` for
            opted-in SLMs' opps so they re-appear here every Monday.

    CompCondition:
      type: object
      required: [field, op, value]
      description: |
        A single condition tested by the multiplier engine. All conditions on
        a rule must match (logical AND). `legacyFlag` is boolean; the others
        are string-valued with numeric-aware comparison.
      properties:
        field:
          type: string
          enum:
            - product
            - rawProduct
            - productFamily
            - type
            - termLength
            - legacyFlag
            - group
            - segment
            - salesRole
            - quoteType
            - oppName
            - funnelStage
            - changeInMrr
            - splitTotalPrice
            - flexFlipAgentStatus
            - fub_first_purchase_date
            - user
            - oppOwner
        op:
          type: string
          enum: [eq, ne, in, notIn, gt, gte, lt, lte, contains, notContains]
        value:
          description: Scalar for `eq`/`ne`; string array for `in`/`notIn`.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string

    CompMultiplierRule:
      type: object
      required: [id, label, conditions, multiplier]
      description: |
        A conditional multiplier. Task #246: rules STACK — every rule whose
        conditions all match contributes its multiplier and the engine
        multiplies them together (was previously first-match-wins).
      properties:
        id:
          type: string
        label:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CompCondition"
        multiplier:
          type: number
          minimum: 0
          maximum: 100
        appliesIn:
          type: string
          enum:
            - quota
            - sales
            - both
          description: |
            Revenue-view mode(s) this rule applies in. "quota" = Quota Target
            Revenue (default/compensable view), "sales" = Sales Target Revenue,
            "both" = either. Omitted is treated as "quota".
        mrrField:
          type: string
          nullable: true
          enum:
            - changeInMrr
            - totalMrr
            - splitTotalPrice
            - totalPrice
            - amount
            - mrr
          description: |
            Task #276: optional per-rule base MRR source override. When set,
            opps matching this rule's full condition set use this feeder-sheet
            numeric column as the base MRR (before the multiplier) instead of
            the Type-driven default. When an opp matches multiple field-setting
            rules, the first (top-down) wins. Ignored for CPD-sourced rows
            (ZMX / Showcase Incremental - Re/Max). Omit/null to keep the default.

    CompPairedCondition:
      type: object
      required: [kind, field, op]
      description: |
        A condition inside a named opportunity. `kind: field` is a normal
        field/op/value test. `kind: comparative` compares this opp's value (for
        an identity/string field) or aggregate magnitude (for a numeric feeder
        field) to another opp's. An identity `=` comparative joins the two opps
        into the same deal/group; an identity `≠` filters within the group; a
        numeric comparative is an aggregate magnitude gate.
      properties:
        kind:
          type: string
          enum: [field, comparative]
        field:
          type: string
          description: |
            For `field` conditions, any condition field. For `comparative`
            conditions, this opp's identity (string) field or numeric feeder
            column (left operand).
          enum:
            - product
            - rawProduct
            - productFamily
            - type
            - termLength
            - legacyFlag
            - group
            - segment
            - salesRole
            - quoteType
            - oppName
            - funnelStage
            - changeInMrr
            - splitTotalPrice
            - flexFlipAgentStatus
            - totalMrr
            - totalPrice
            - amount
            - mrr
            - contactId
            - accountId
            - closeDate
            - fub_first_purchase_date
            - rep
            - user
            - oppOwner
        op:
          type: string
          enum: [eq, ne, in, notIn, gt, gte, lt, lte, contains, notContains]
        value:
          nullable: true
          description: Scalar for `eq`/`ne`/comparisons; string array for `in`/`notIn`. Unused for comparative conditions.
          oneOf:
            - type: string
            - type: number
            - type: boolean
            - type: array
              items:
                type: string
        compareToOpp:
          type: string
          nullable: true
          description: Comparative only — name of the opp supplying the right operand. May be another opp OR this opp's own name (a same-opp, per-row internal field comparison). A cross-opp identity eq/ne JOIN must reference an earlier opp in the rule's list; same-opp comparatives and closeDate ordering gates have no such ordering requirement.
        compareToField:
          type: string
          nullable: true
          description: Comparative only — that opp's field (right operand). Must be the same kind (identity vs numeric) as `field`.
          enum:
            - changeInMrr
            - totalMrr
            - splitTotalPrice
            - totalPrice
            - amount
            - mrr
            - contactId
            - accountId
            - closeDate
            - fub_first_purchase_date
            - product
            - rawProduct
            - productFamily
            - type
            - rep
            - user
            - oppOwner
            - oppName
            - funnelStage
            - termLength
            - group
            - segment
            - salesRole
            - quoteType
        dateGranularity:
          type: string
          nullable: true
          enum: [month, exact]
          description: Identity comparative only — for date fields (e.g. closeDate). Defaults to month.
        factor:
          type: number
          nullable: true
          description: Numeric (magnitude) comparative only — scalar applied to the right operand (compareTo opp's Σ field) via `factorOp` before the comparison. Defaults to 1.
        factorOp:
          type: string
          nullable: true
          enum: [add, subtract, multiply, divide]
          description: "Task #411 — math operator combining the right operand's Σ field with the `factor` scalar (Σ RHS factorOp factor). Defaults to multiply, preserving legacy behavior. Numeric comparative only."
        leftFactor:
          type: number
          nullable: true
          description: "Per-side scalar applied to THIS opp's Σ field via `leftFactorOp` before the comparison. Defaults to 1. Numeric comparative only."
        leftFactorOp:
          type: string
          nullable: true
          enum: [add, subtract, multiply, divide]
          description: "Per-side math operator combining this opp's Σ field with `leftFactor`. Defaults to multiply. Numeric comparative only."
        rightFactor:
          type: number
          nullable: true
          description: "Per-side scalar applied to the compareTo opp's Σ field via `rightFactorOp`. Falls back to the legacy `factor` when absent. Defaults to 1. Numeric comparative only."
        rightFactorOp:
          type: string
          nullable: true
          enum: [add, subtract, multiply, divide]
          description: "Per-side math operator combining the compareTo opp's Σ field with `rightFactor`. Falls back to the legacy `factorOp` when absent. Defaults to multiply. Numeric comparative only."
        leftSigned:
          type: boolean
          nullable: true
          description: "Task #411 — when true, this opp's Σ field is compared as the raw SIGNED aggregate (Actual Value); when false/absent it is compared by magnitude (Absolute Value, the default). Numeric comparative only."
        rightSigned:
          type: boolean
          nullable: true
          description: "Task #411 — when true, the compareTo opp's combined operand is compared as the raw SIGNED value (Actual Value); when false/absent it is compared by magnitude (Absolute Value, the default). Numeric comparative only."
        signed:
          type: boolean
          nullable: true
          description: Legacy (pre-#411) single flag — when true BOTH sides compared signed. Still read for back-compat when leftSigned/rightSigned are absent. Superseded by the per-side flags. Defaults to false.
        leftTerms:
          type: array
          nullable: true
          description: "Task #420 — per-side FORMULA for the LEFT operand. An ordered list of logic terms combined by precedence (× / ÷ before + / −). When present (numeric comparatives only) it SUPERSEDES the single field + leftFactor/leftSigned operand. Each opp term's modifier is applied abs-inside: (abs(Σ) factorOp factor). Ignored for identity comparatives."
          items:
            $ref: "#/components/schemas/CompLogicTerm"
        rightTerms:
          type: array
          nullable: true
          description: "Task #420 — per-side FORMULA for the RIGHT operand. Same shape/semantics as leftTerms; supersedes compareToOpp/compareToField + rightFactor/rightSigned when present."
          items:
            $ref: "#/components/schemas/CompLogicTerm"

    CompLogicTerm:
      type: object
      description: "Task #420 — a single logic object within a numeric comparative side. Either an opp-field term (Σ of a feeder MRR column over a named opp's rows, with abs/actual + factor applied abs-inside) or a custom literal constant."
      required: [source]
      properties:
        source:
          type: string
          enum: [opp, custom]
          description: "opp = Σ of a feeder MRR column over a named opp's rows; custom = a literal constant."
        joinOp:
          type: string
          nullable: true
          enum: [add, subtract, multiply, divide]
          description: "Operator joining this term to the PREVIOUS term on its side. Ignored on the first term. Defaults to add."
        opp:
          type: string
          nullable: true
          description: "opp term only — name of an opp in the same rule whose Σ field this term sums."
        field:
          type: string
          nullable: true
          enum: [changeInMrr, totalMrr, splitTotalPrice, totalPrice, amount, mrr]
          description: "opp term only — feeder MRR column summed for that opp."
        factor:
          type: number
          nullable: true
          description: "opp term only — inner scalar combined with the (abs/actual) Σ via factorOp. Defaults to 1."
        factorOp:
          type: string
          nullable: true
          enum: [add, subtract, multiply, divide]
          description: "opp term only — math operator combining the (abs/actual) Σ with factor: value = (Σ) factorOp factor. Defaults to multiply."
        signed:
          type: boolean
          nullable: true
          description: "opp term only — when true compares the raw SIGNED Σ (Actual Value); false/absent uses magnitude |Σ| (Absolute Value, default)."
        value:
          type: number
          nullable: true
          description: "custom term only — literal constant (may be negative; up to 2 decimal places)."

    CompNamedOpp:
      type: object
      required: [name, mode, conditions]
      description: |
        A named opportunity within a paired-opp rule. `match` opps must have at
        least one matching row in a deal; `exclude` opps must have none. (The UI
        labels these EXISTS / DOES NOT EXIST.)
      properties:
        name:
          type: string
          description: Unique within the rule — referenced by comparative conditions + adjustments.
        mode:
          type: string
          enum: [match, exclude]
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CompPairedCondition"

    CompAdjustment:
      type: object
      required: [targetOpp, op]
      description: |
        One adjustment applied to a matched group, targeting a named Match opp.
        The math is applied to that opp's combined compensable MRR, then
        distributed across its member rows proportional to |actual MRR|.
      properties:
        targetOpp:
          type: string
          description: Name of the Match opp this adjustment affects.
        op:
          type: string
          enum:
            - waive
            - keep
            - fixedCredit
            - capAt
            - incremental
            - greaterOfFloorOrIncremental
            - multiplyByFactor
            - reassignMrrField
            - ignoreAcqChurn
        amount:
          type: number
          nullable: true
          description: Dollar/factor parameter for fixedCredit / capAt / greaterOfFloorOrIncremental / multiplyByFactor.
        comparisonOpp:
          type: string
          nullable: true
          description: Name of the Match opp supplying |comparison| for incremental / greaterOfFloorOrIncremental.
        comparisonField:
          type: string
          nullable: true
          enum: [changeInMrr, totalMrr, splitTotalPrice, totalPrice, amount, mrr]
          description: |
            Optional feeder MRR column used to measure the comparison opp for
            incremental / greaterOfFloorOrIncremental. When omitted, the
            comparison uses the comparison opp's standardized MRR (existing
            behavior). The target side always uses |standardized MRR|.
        mrrField:
          type: string
          nullable: true
          enum: [changeInMrr, totalMrr, splitTotalPrice, totalPrice, amount, mrr]
          description: Feeder MRR column for reassignMrrField (feeder-only).
        reassignOwnerToOpp:
          type: string
          nullable: true
          description: |
            Reassign the target opp's credit to this named (Match) opp's owner —
            gated to target rows whose owner role is in reassignableOwnerRoles.

    PairedOppRule:
      type: object
      required: [id, label, enabled, opps, adjustments]
      description: |
        A generic per-month cross-opp (paired-opp) rule. The first opp is the
        anchor; every other opp ties itself to the deal via an identity `=`
        comparative condition referencing an earlier opp. Comparatives may also
        reference their own opp (a per-row internal field comparison), and
        closeDate supports chronological ordering (>, >=, <, <=). Evaluates named
        Match/Exclude opps and applies adjustments referencing opps by name.
        Replaces the hardcoded FUB↔Zpro pairing and the cancel/rebook
        churn-suppression.
      properties:
        id:
          type: string
        label:
          type: string
        enabled:
          type: boolean
        opps:
          type: array
          items:
            $ref: "#/components/schemas/CompNamedOpp"
        adjustments:
          type: array
          items:
            $ref: "#/components/schemas/CompAdjustment"
        reassignableOwnerRoles:
          type: array
          nullable: true
          description: Owner roles eligible for reassignOwnerToOpp. Defaults to Compliance Sales / Account Sales when omitted.
          items:
            type: string
        appliesIn:
          type: string
          enum:
            - quota
            - sales
            - both
          description: |
            Revenue-view mode(s) this rule applies in. "quota" = Quota Target
            Revenue (default/compensable view), "sales" = Sales Target Revenue,
            "both" = either. Omitted is treated as "quota".

    CompConditionTestStatus:
      type: string
      enum: [match, noMatch, notTestable]
      description: |
        Per-condition diagnostic outcome. `match` = the pasted opp satisfies the
        condition, `noMatch` = it does not, `notTestable` = it can't be evaluated
        with one opp (e.g. a cross-opp comparative whose partner wasn't resolved).

    CompMultiplierRuleDiagnosis:
      type: object
      required: [conditions]
      properties:
        conditions:
          type: array
          description: Aligned index-for-index to the rule's conditions.
          items:
            $ref: "#/components/schemas/CompConditionTestStatus"

    CompPairedFiresVerdict:
      type: string
      enum: [fires, doesNotFire, incomplete]
      description: |
        Overall result of pinning the filled-in opps to their roles and running
        the pairing logic. `incomplete` when no opp ids were entered at all.

    CompPairedOppDiagnosis:
      type: object
      required: [name, isSelf, resolved, conditions]
      properties:
        name:
          type: string
        isSelf:
          type: boolean
          description: True for the named-opp role the pasted opp was mapped to.
        resolved:
          type: boolean
          description: Whether some row filled this role for the pasted opp's deal.
        conditions:
          type: array
          description: Aligned index-for-index to this named opp's conditions.
          items:
            $ref: "#/components/schemas/CompConditionTestStatus"
        pinned:
          type: boolean
          description: |
            Task #394. True when an opp id was pasted into this role's card.
        found:
          type: boolean
          description: |
            Task #394. Whether the pasted opp id resolved to a row (false → the
            card shows "Opp not found"). True for blank roles (nothing to look up).

    CompPairedRuleDiagnosis:
      type: object
      required: [selfOppName, opps]
      properties:
        selfOppName:
          type: string
          nullable: true
          description: The named opp the pasted opp mapped to (null if none).
        opps:
          type: array
          description: Aligned index-for-index to the rule's opps.
          items:
            $ref: "#/components/schemas/CompPairedOppDiagnosis"
        fires:
          $ref: "#/components/schemas/CompPairedFiresVerdict"

    CompTestOppResult:
      type: object
      required: [found]
      description: |
        Result of diagnosing a pasted opp id against a rule. `found` is false
        when no row carries that opp id (the UI shows "Opp not found"). Exactly
        one of `multiplier` / `paired` is present when `found` is true, matching
        the requested rule `kind`.
      properties:
        found:
          type: boolean
        multiplier:
          $ref: "#/components/schemas/CompMultiplierRuleDiagnosis"
        paired:
          $ref: "#/components/schemas/CompPairedRuleDiagnosis"

    CompensationConfig:
      type: object
      required: [monthYyyymm, multiplierRules, pairedOppRules, isDefault]
      description: |
        Per-month compensation config. `isDefault` is true when no saved row
        exists and the June reference defaults are being returned.
      properties:
        monthYyyymm:
          type: string
          pattern: '^\d{4}-\d{2}$'
        multiplierRules:
          type: array
          items:
            $ref: "#/components/schemas/CompMultiplierRule"
        pairedOppRules:
          type: array
          items:
            $ref: "#/components/schemas/PairedOppRule"
        updatedByName:
          type: string
          nullable: true
        updatedByRole:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        isDefault:
          type: boolean

    ProductLogicAssign:
      type: object
      required: [kind]
      description: |
        How a matched rule assigns the canonical product. `literal` => a fixed
        product name (`product`). `field` => copy the value of a raw opp field
        (`field`), applying the legacy "Market Based Pricing" -> "MBP"
        normalization and blank -> "No Product Selected" fallback.
      properties:
        kind:
          type: string
          enum: [literal, field]
        product:
          type: string
          description: Set when `kind` is `literal`.
        field:
          type: string
          enum: [rawProduct, productFamily]
          description: Set when `kind` is `field`.

    ProductLogicRule:
      type: object
      required: [id, label, conditions, assign, mrrField, treatAsClosedWon, source]
      description: |
        One rule in the ordered, FIRST-MATCH product-logic set. All conditions
        must match (logical AND); the first matching rule wins.
      properties:
        id:
          type: string
        label:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/CompCondition"
        assign:
          $ref: "#/components/schemas/ProductLogicAssign"
        mrrField:
          type: string
          enum:
            - changeInMrr
            - totalMrr
            - splitTotalPrice
            - totalPrice
            - amount
            - mrr
            - mrr_added
            - positive_change_in_mrr
            - negative_change_in_mrr
          description: |
            Numeric MRR column standardizeMrr reads for matched rows. The picker
            is source-scoped: feeder columns (changeInMrr…mrr) for `feeder`
            rules, CPD-object columns (mrr_added, positive_change_in_mrr,
            negative_change_in_mrr) for `cpd` rules. CPD `mrr_added` reads the
            splitTotalPrice basis ingest copies onto the synthetic row.
        treatAsClosedWon:
          type: boolean
          description: |
            When true, rows attributed to this rule's product are treated as
            Closed Won while in Discovery and their effective close date is
            pinned to the 1st of the month (generalizes Overage handling).
        source:
          type: string
          enum: [feeder, cpd]
          description: |
            MRR source of the rule, mirroring the compensation engine: `feeder`
            (Salesforce feeder sheet) vs `cpd` (Databricks CPD synthetic object).
            The chosen `mrrField` must belong to this source — feeder columns for
            feeder rules, CPD-object columns for CPD rules.
        isCatchAll:
          type: boolean
          description: The terminal passthrough rule catching everything else.

    ProductRenameEntry:
      type: object
      required: [canonical]
      description: |
        Display-only rename for a canonical product. The canonical key is never
        changed (Goals/Comp depend on it); these only affect presentation.
      properties:
        canonical:
          type: string
        filterName:
          type: string
          description: Name shown in the product filter (defaults to canonical).
        abbreviation:
          type: string
          description: Short label used in charts/visualizations.
        oppNameOverride:
          type: string
          description: Optional override for the opp name shown in drilldowns.

    ProductLogicConfig:
      type: object
      required: [rules, renameMap, isDefault]
      description: |
        Global Product Logic config. `isDefault` is true when no saved row
        exists and the code defaults are being returned.
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/ProductLogicRule"
        renameMap:
          type: array
          items:
            $ref: "#/components/schemas/ProductRenameEntry"
        updatedByName:
          type: string
          nullable: true
        updatedByRole:
          type: string
          nullable: true
        updatedAt:
          type: string
          nullable: true
        isDefault:
          type: boolean

    ProductLogicExample:
      type: object
      required: [ruleId, fields, source]
      description: |
        A representative example opportunity snapshotted per rule, persisted so
        it survives beyond the ~2-month feeder window. `fields` holds the raw
        opp fields; the SF identity columns let the frontend resolve a link.
      properties:
        ruleId:
          type: string
        fields:
          type: object
          additionalProperties:
            type: string
        source:
          type: string
          enum: [feeder, cpd]
        oppId:
          type: string
          nullable: true
        accountId:
          type: string
          nullable: true
        sfContactId:
          type: string
          nullable: true
        sfCpdId:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time

    ManagerEstimateRow:
      type: object
      required: [flmName, monthYyyymm, product, unweightedAmount, updatedByName, updatedByRole, updatedAt]
      description: |
        Per-(FLM, month, product) unweighted churn estimate. `updatedByName`
        and `updatedByRole` are null on the auto-materialized $0 rows that
        have never been edited.
      properties:
        flmName:
          type: string
        monthYyyymm:
          type: string
          pattern: '^\d{4}-\d{2}$'
        product:
          type: string
        unweightedAmount:
          type: number
        updatedByName:
          type: string
          nullable: true
        updatedByRole:
          type: string
          nullable: true
        updatedAt:
          type: string
          format: date-time

    RosterFieldSet:
      type: object
      required: [active, flm, slm, region, segment, salesRole]
      description: A resolved field set (base or effective hierarchy values).
      properties:
        active:
          type: boolean
        flm:
          type: string
          nullable: true
        slm:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        segment:
          type: string
          nullable: true
        salesRole:
          type: string
          nullable: true

    RosterOverrideSet:
      type: object
      required: [active, flm, slm, region, segment, salesRole]
      description: |
        A person's per-month override field set. Every field is nullable;
        `null` means no override for that field (the base value applies).
      properties:
        active:
          type: boolean
          nullable: true
        flm:
          type: string
          nullable: true
        slm:
          type: string
          nullable: true
        region:
          type: string
          nullable: true
        segment:
          type: string
          nullable: true
        salesRole:
          type: string
          nullable: true

    RosterPersonRow:
      type: object
      required: [person, role, base, override, effective]
      description: |
        One roster row: a person (active or inactive) with their base
        hierarchy values, the stored month override, and the resolved
        effective values (override falling back to base).
      properties:
        person:
          type: string
        role:
          type: string
          enum: [slm, flm, rep]
        base:
          $ref: "#/components/schemas/RosterFieldSet"
        override:
          $ref: "#/components/schemas/RosterOverrideSet"
        effective:
          $ref: "#/components/schemas/RosterFieldSet"

    GoalMetrics:
      type: object
      required: [mrrAddedGoal, mrrChurnGoal, mrrAddedMinimum, mrrChurnMaximum]
      description: The four goal metrics resolved per (rep, product).
      properties:
        mrrAddedGoal:
          type: number
        mrrChurnGoal:
          type: number
        mrrAddedMinimum:
          type: number
        mrrChurnMaximum:
          type: number

    HierarchyJoinField:
      type: string
      description: A hierarchy-side field available for joining a source row to a rep.
      enum: [Employee Number, Group, Region, Segment, Name]

    GoalMetricKey:
      type: string
      enum: [mrrAddedGoal, mrrChurnGoal, mrrAddedMinimum, mrrChurnMaximum]

    GoalProduct:
      type: string
      enum: [Showcase, MBP, Zillow Pro, Follow Up Boss, ZMX]

    RoleGroupMapEntry:
      type: object
      required: [salesRole, group]
      description: Maps a hierarchy sales role to a group label used by the Goal CSV join.
      properties:
        salesRole:
          type: string
        group:
          type: string

    GoalCsvJoinField:
      type: object
      required: [csv, hierarchy]
      description: A join pair linking a Goal CSV column to a hierarchy field.
      properties:
        csv:
          type: string
        hierarchy:
          $ref: "#/components/schemas/HierarchyJoinField"

    FinancePpsJoinField:
      type: object
      required: [financePps, hierarchy]
      description: A join pair linking a finance.pps column to a hierarchy field.
      properties:
        financePps:
          type: string
        hierarchy:
          $ref: "#/components/schemas/HierarchyJoinField"

    FinancePpsOutputMapEntry:
      type: object
      required: [column, metric, product]
      description: Maps a finance.pps column to a (metric, product) goal target.
      properties:
        column:
          type: string
        metric:
          $ref: "#/components/schemas/GoalMetricKey"
        product:
          $ref: "#/components/schemas/GoalProduct"

    GoalCsvProductValueEntry:
      type: object
      required: [product, value]
      description: |
        Maps a dashboard product to the distinct value found in the Goal CSV's
        Product column that identifies that product's rows.
      properties:
        product:
          $ref: "#/components/schemas/GoalProduct"
        value:
          type: string

    SoftwareColumnMap:
      type: object
      required: [mrrAddedGoal, mrrChurnGoal, mrrAddedMinimum, mrrChurnMaximum]
      description: Per-metric sub-source column names for the Software % Rules source.
      properties:
        mrrAddedGoal:
          type: string
        mrrChurnGoal:
          type: string
        mrrAddedMinimum:
          type: string
        mrrChurnMaximum:
          type: string

    SoftwarePctRules:
      type: object
      required: [subSource, columnMapping, percentages]
      description: |
        Software % Rules config: the sub-source choice, its column mapping, and
        the per-software-product percentages (whole integers summing to 100).
        Software products are Showcase, Zillow Pro, Follow Up Boss, ZMX.
      properties:
        subSource:
          type: string
          enum: [financePps, goalCsv]
        columnMapping:
          type: object
          required: [financePps, goalCsv]
          properties:
            financePps:
              $ref: "#/components/schemas/SoftwareColumnMap"
            goalCsv:
              $ref: "#/components/schemas/SoftwareColumnMap"
        percentages:
          type: object
          required: [Showcase, Zillow Pro, Follow Up Boss, ZMX]
          properties:
            Showcase:
              type: number
            Zillow Pro:
              type: number
            Follow Up Boss:
              type: number
            ZMX:
              type: number

    GoalsConfig:
      type: object
      required:
        - roleGroupMapping
        - goalCsvJoinFields
        - goalCsvOutputMapping
        - goalCsvInspectColumns
        - goalCsvProductColumn
        - goalCsvProductValueMapping
        - financePpsJoinFields
        - financePpsOutputMapping
        - financePpsInspectColumns
        - softwareGnrRules
        - softwareAcqRules
      description: The complete editable config powering the Goals tab.
      properties:
        roleGroupMapping:
          type: array
          items:
            $ref: "#/components/schemas/RoleGroupMapEntry"
        goalCsvJoinFields:
          type: array
          items:
            $ref: "#/components/schemas/GoalCsvJoinField"
        goalCsvOutputMapping:
          type: array
          items:
            $ref: "#/components/schemas/FinancePpsOutputMapEntry"
        goalCsvInspectColumns:
          type: array
          items:
            type: string
        goalCsvProductColumn:
          type: string
          description: |
            The Goal CSV column whose value identifies which dashboard product a
            row belongs to. Empty when not yet configured.
        goalCsvProductValueMapping:
          type: array
          items:
            $ref: "#/components/schemas/GoalCsvProductValueEntry"
        financePpsJoinFields:
          type: array
          items:
            $ref: "#/components/schemas/FinancePpsJoinField"
        financePpsOutputMapping:
          type: array
          items:
            $ref: "#/components/schemas/FinancePpsOutputMapEntry"
        financePpsInspectColumns:
          type: array
          items:
            type: string
        softwareGnrRules:
          $ref: "#/components/schemas/SoftwarePctRules"
        softwareAcqRules:
          $ref: "#/components/schemas/SoftwarePctRules"

    GoalsConfigEnvelope:
      type: object
      required: [config, options]
      properties:
        config:
          $ref: "#/components/schemas/GoalsConfig"
        options:
          type: object
          required: [products, softwareProducts, metrics, hierarchyJoinFields]
          properties:
            products:
              type: array
              items:
                $ref: "#/components/schemas/GoalProduct"
            softwareProducts:
              type: array
              items:
                type: string
            metrics:
              type: array
              items:
                $ref: "#/components/schemas/GoalMetricKey"
            hierarchyJoinFields:
              type: array
              items:
                $ref: "#/components/schemas/HierarchyJoinField"

    ResolvedGoals:
      type: object
      description: |
        Resolved goals for a month: rep name → product name → metrics. Products
        and metrics a source does not populate are absent (read as zero
        downstream).
      additionalProperties:
        type: object
        additionalProperties:
          $ref: "#/components/schemas/GoalMetrics"

    GoalSourceId:
      type: string
      description: Which goal source drives a row's base goals.
      enum: [financePps, goalCsv, softwareGnr, softwareAcq]

    GoalTableRow:
      type: object
      description: One assembled main Goals-table row (rep × product × month).
      required:
        - month
        - group
        - rep
        - employeeId
        - salesRole
        - slm
        - flm
        - region
        - segment
        - teamSize
        - product
        - source
        - mrrAddedGoal
        - mrrChurnGoal
        - mrrAddedMinimum
        - mrrChurnMaximum
        - mrrAddedManualMultiplier
        - mrrChurnManualMultiplier
        - loaStatus
        - eRepManualMultiplier
        - eRepDatabricksMultiplier
        - eRepMultiplier
        - finalMrrAddedGoal
        - finalChurnGoal
        - finalMrrMinGoal
        - finalChurnMaxGoal
      properties:
        month:
          type: string
        group:
          type: string
        rep:
          type: string
        employeeId:
          type: string
        salesRole:
          type: string
        slm:
          type: string
        flm:
          type: string
        region:
          type: string
        segment:
          type: string
        teamSize:
          type: integer
          description: Distinct reps sharing this rep's Channel + Region + Segment.
        product:
          $ref: "#/components/schemas/GoalProduct"
        source:
          $ref: "#/components/schemas/GoalSourceId"
        mrrAddedGoal:
          type: number
        mrrChurnGoal:
          type: number
        mrrAddedMinimum:
          type: number
        mrrChurnMaximum:
          type: number
        mrrAddedManualMultiplier:
          type: number
        mrrChurnManualMultiplier:
          type: number
        loaStatus:
          type: string
        eRepManualMultiplier:
          type: [number, 'null']
          description: Per-row manual eRep override, or null when none is set.
        eRepDatabricksMultiplier:
          type: [number, 'null']
          description: Databricks-sourced eRep value for this rep+month, or null.
        eRepMultiplier:
          type: number
          description: Effective eRep used in the Final columns = manual ?? databricks ?? 1.0.
        finalMrrAddedGoal:
          type: number
        finalChurnGoal:
          type: number
        finalMrrMinGoal:
          type: number
        finalChurnMaxGoal:
          type: number

    GoalRowOverrideInput:
      type: object
      description: |
        Upsert payload for a single Goals-table row override. `month`, `rep` and
        `product` identify the row; the remaining fields are optional and only
        the provided ones are changed.
      required: [month, rep, product]
      properties:
        month:
          type: string
          pattern: '^\d{4}-\d{2}$'
        rep:
          type: string
        product:
          $ref: "#/components/schemas/GoalProduct"
        source:
          $ref: "#/components/schemas/GoalSourceId"
        mrrAddedManualMultiplier:
          type: number
          minimum: 0
        mrrChurnManualMultiplier:
          type: number
          minimum: 0
        loaStatus:
          type: string
        eRepMultiplier:
          type: [number, 'null']
          minimum: 0
          description: |
            Manual eRep override. Omit to leave unchanged, send null to clear
            back to the Databricks-sourced value, or a number to set it.

    GoalRowOverride:
      type: object
      description: A persisted Goals-table per-row override.
      required:
        - monthYyyymm
        - rep
        - product
        - source
        - mrrAddedManualMultiplier
        - mrrChurnManualMultiplier
        - loaStatus
        - eRepMultiplier
        - updatedAt
      properties:
        monthYyyymm:
          type: string
        rep:
          type: string
        product:
          type: string
        source:
          type: string
        mrrAddedManualMultiplier:
          type: number
        mrrChurnManualMultiplier:
          type: number
        loaStatus:
          type: string
        eRepMultiplier:
          type: [number, 'null']
        updatedAt:
          type: string
          format: date-time
        updatedByName:
          type: [string, 'null']
        updatedByRole:
          type: [string, 'null']

  responses:
    GoalsValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: string

  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
