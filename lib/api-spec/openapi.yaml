openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sales
    description: Sales dashboard operations
  - name: sheets
    description: Google Sheets proxy operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: preferences
    description: Per-user preferences storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /sales/config:
    get:
      operationId: getSalesConfig
      tags: [sales]
      summary: Get org hierarchy and filter options
      parameters:
        - name: month
          in: query
          required: false
          description: >-
            Month in `YYYY-MM` format. When supplied, the org / region /
            group / segment selector lists are derived from the month-aware
            effective hierarchy (so per-month roster reactivations appear in
            the dropdowns). When omitted, the base sheet-level active flag is
            used.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Sales config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesConfig"
  /sales/pipeline:
    get:
      operationId: getSalesPipeline
      tags: [sales]
      summary: Get pipeline data for all reps
      responses:
        "200":
          description: Pipeline data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineData"
  /sales/activity:
    get:
      operationId: getSalesActivity
      tags: [sales]
      summary: Get activity metrics for all reps
      responses:
        "200":
          description: Activity data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityData"
  /sales/actions:
    get:
      operationId: getSalesActions
      tags: [sales]
      summary: Get action tables data
      responses:
        "200":
          description: Actions data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActionsData"
  /sales/anaplan:
    get:
      operationId: getSalesAnaplan
      tags: [sales]
      summary: Anaplan Check Tool reconciliation
      description: |
        Reconciles Anaplan per-CPD current-month MRR against the dashboard's
        comp-engine quota-mode compensable MRR (joined by the CPD's
        opportunity_ids). Visible to all roles; no hierarchy scoping.
      parameters:
        - in: query
          name: from
          required: false
          schema:
            type: string
          description: Start of the close-date window (YYYY-MM-DD). Selects the month.
        - in: query
          name: to
          required: false
          schema:
            type: string
          description: End of the close-date window (YYYY-MM-DD).
        - in: query
          name: rawConditions
          required: false
          schema:
            type: string
          description: >
            JSON-encoded admin Conditions builder filter (same as the pipeline
            endpoints). Applied server-side before reconciliation; ignored for
            non-admin callers.
      responses:
        "200":
          description: Anaplan reconciliation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnaplanCheckResult"
  /sales/photos:
    get:
      operationId: getSalesPhotos
      tags: [sales]
      summary: Get profile photo URLs for all people in org hierarchy
      responses:
        "200":
          description: Photo URL map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoMap"
  /sales/photos/sync:
    post:
      operationId: syncSalesPhotos
      tags: [sales]
      summary: Trigger manual photo sync from Slack
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoSyncResult"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to returnTo on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /me/preferences/{key}:
    get:
      tags: [preferences]
      operationId: getUserPreference
      summary: Read a per-user preference value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Preference value (null if not set).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      tags: [preferences]
      operationId: setUserPreference
      summary: Save a per-user preference value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferenceEnvelope'
      responses:
        '200':
          description: Preference saved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPreferenceEnvelope'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      tags: [preferences]
      operationId: deleteUserPreference
      summary: Delete a per-user preference value
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
        '401':
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /sales/unreviewed-opps:
    get:
      operationId: getUnreviewedOpportunities
      tags: [sales]
      summary: List opportunities that the rep has not yet explicitly reviewed
      description: |
        Returns the open + scheduled-mod opportunities whose `isReviewed`
        flag is false (no override row, OR override row with `reviewed_at`
        cleared by the Sunday HST cron). Drives the "Unreviewed Opportunities"
        modal and the unreviewed-count badge.
      responses:
        "200":
          description: Unreviewed opportunities
          content:
            application/json:
              schema:
                type: object
                required: [opportunities]
                properties:
                  opportunities:
                    type: array
                    items:
                      $ref: "#/components/schemas/Opportunity"
  /sales/opp-probabilities/{oppId}:
    put:
      operationId: setOppProbability
      tags: [sales]
      summary: Set or update the per-opportunity probability override
      description: |
        Inserts or updates the override row and stamps `reviewed_at = now()`,
        which marks the opportunity as explicitly reviewed (clears the yellow
        "needs review" highlight and removes it from the Unreviewed
        Opportunities list until the next Sunday HST reset, if enabled).
      parameters:
        - name: oppId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [probability]
              properties:
                probability:
                  type: number
                  minimum: 0
                  maximum: 100
      responses:
        "200":
          description: Override saved
          content:
            application/json:
              schema:
                type: object
                required: [oppId, probability]
                properties:
                  oppId:
                    type: string
                  probability:
                    type: number
    delete:
      operationId: clearOppProbability
      tags: [sales]
      summary: Remove a per-opportunity probability override
      description: |
        Deletes the override row entirely. The opp falls back to the stage
        default probability AND returns to the Unreviewed Opportunities list
        because there is no `reviewed_at` to satisfy `isReviewed`.
      parameters:
        - name: oppId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Override cleared
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
  /sales/manager-estimates:
    get:
      operationId: getManagerEstimates
      tags: [sales]
      summary: List Manager Estimate rows for a month
      description: |
        Per-(FLM, month, product) unweighted churn estimate values. Used
        by the GNR Churn Forecast popup's pinned ME row and by the Sched
        Mods drilldown's pinned ME row. Filter by `flms` (CSV of FLM
        names) to scope to the visible team.
      parameters:
        - name: month
          in: query
          required: true
          description: Month in `YYYY-MM` format.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
        - name: flms
          in: query
          required: false
          description: Comma-separated list of FLM names to filter by.
          schema:
            type: string
      responses:
        "200":
          description: Manager Estimate rows
          content:
            application/json:
              schema:
                type: object
                required: [estimates]
                properties:
                  estimates:
                    type: array
                    items:
                      $ref: "#/components/schemas/ManagerEstimateRow"
        "400":
          description: Invalid `month` parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      operationId: upsertManagerEstimate
      tags: [sales]
      summary: Upsert a Manager Estimate $ value
      description: |
        Idempotent upsert keyed by `(flmName, monthYyyymm, product)`.
        FLMs may only edit their own team's value; SLM/admin may edit
        any FLM's value. The SLM cross-FLM-overwrite warning is enforced
        client-side; the server only gates by role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flmName, monthYyyymm, product, unweightedAmount]
              properties:
                flmName:
                  type: string
                monthYyyymm:
                  type: string
                  pattern: '^\d{4}-\d{2}$'
                product:
                  type: string
                unweightedAmount:
                  type: number
                  minimum: 0
      responses:
        "200":
          description: Estimate saved
          content:
            application/json:
              schema:
                type: object
                required: [estimate]
                properties:
                  estimate:
                    $ref: "#/components/schemas/ManagerEstimateRow"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        "403":
          description: FLM attempted to edit another FLM's row
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /sales/compensation/config:
    get:
      operationId: getCompensationConfig
      tags: [sales]
      summary: Get the per-month compensation rules config
      description: |
        Returns the compensation config for a month (`YYYY-MM`, defaults to
        the current month). When no saved row exists, the June reference
        defaults are returned with `isDefault: true`. Restricted to
        admin / SLM / exec.
      parameters:
        - name: month
          in: query
          required: false
          description: Month in `YYYY-MM` format. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      responses:
        "200":
          description: Compensation config
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/CompensationConfig"
        "400":
          description: Invalid `month` parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
    put:
      operationId: updateCompensationConfig
      tags: [sales]
      summary: Upsert the per-month compensation rules config
      description: |
        Replaces the multiplier rules and FUB↔Zpro rule for a month. The
        config is independent month-to-month. Restricted to admin / SLM /
        exec and blocked for view-only sessions.
      parameters:
        - name: month
          in: query
          required: false
          description: Month in `YYYY-MM` format. Defaults to the current month.
          schema:
            type: string
            pattern: '^\d{4}-\d{2}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [multiplierRules, pairedOppRules]
              properties:
                multiplierRules:
                  type: array
                  items:
                    $ref: "#/components/schemas/CompMultiplierRule"
                pairedOppRules:
                  type: array
                  items:
                    $ref: "#/components/schemas/PairedOppRule"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/CompensationConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /sales/compensation/test-opp:
    post:
      operationId: testCompensationOpp
      tags: [sales]
      summary: Diagnose a pasted opp id against a (draft) compensation rule
      description: |
        Read-only per-condition diagnostic. Given a pasted opportunity id and a
        single rule (multiplier or paired-opp), classify every condition as
        `match` / `noMatch` / `notTestable`. The opp is looked up across ALL
        months; for paired rules its partner opp(s) are auto-resolved via the
        rule's link fields. The rule is taken from the request body so the
        result tracks unsaved edits in the rule card. This endpoint never
        changes real compensation evaluation. Available to all authenticated
        roles.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, rule]
              properties:
                oppId:
                  type: string
                  description: |
                    The opportunity id to test. Required for `multiplier` rules
                    and the legacy single-id paired path.
                oppTestIds:
                  type: array
                  description: |
                    Paired rules only. Pasted opp ids PINNED to each named role,
                    aligned index-for-index to the rule's `opps` (empty string =
                    that role is left blank and auto-resolved). When present this
                    takes precedence over `oppId` for paired rules.
                  items:
                    type: string
                kind:
                  type: string
                  enum: [multiplier, paired]
                  description: Which kind of rule `rule` is.
                rule:
                  description: |
                    The rule to test. A `CompMultiplierRule` when `kind` is
                    `multiplier`, a `PairedOppRule` when `kind` is `paired`.
                  oneOf:
                    - $ref: "#/components/schemas/CompMultiplierRule"
                    - $ref: "#/components/schemas/PairedOppRule"
      responses:
        "200":
          description: Diagnostic result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompTestOppResult"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /sales/product-logic/config:
    get:
      operationId: getProductLogicConfig
      tags: [sales]
      summary: Get the global Product Logic rule set + rename map
      description: |
        Returns the singleton global Product Logic config — the ordered,
        first-match rule set driving product attribution / MRR-field selection /
        Overage closed-won handling, plus the display-only rename map. When no
        saved row exists the code defaults are returned with `isDefault: true`.
        Restricted to admin / SLM / exec.
      responses:
        "200":
          description: Product Logic config
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/ProductLogicConfig"
    put:
      operationId: updateProductLogicConfig
      tags: [sales]
      summary: Upsert the global Product Logic rule set + rename map
      description: |
        Replaces the global rule set and rename map. Rules are evaluated
        top-down and the FIRST matching rule wins. Restricted to admin / SLM /
        exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rules, renameMap]
              properties:
                rules:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProductLogicRule"
                renameMap:
                  type: array
                  items:
                    $ref: "#/components/schemas/ProductRenameEntry"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: "#/components/schemas/ProductLogicConfig"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
  /sales/product-logic/examples:
    get:
      operationId: getProductLogicExamples
      tags: [sales]
      summary: Get the per-rule example opportunity snapshots
      description: |
        Returns one representative example opportunity per rule id, snapshotted
        so the editor has a concrete example beyond the feeder window.
        Restricted to admin / SLM / exec.
      responses:
        "200":
          description: Per-rule examples
          content:
            application/json:
              schema:
                type: object
                required: [examples]
                properties:
                  examples:
                    type: array
                    items:
                      $ref: "#/components/schemas/ProductLogicExample"
  /sales/goals/config:
    get:
      operationId: getGoalsConfig
      tags: [sales]
      summary: Get the editable Goals config plus enum options
      description: |
        Returns the complete editable Goals config (role→group mapping, join
        fields, finance.pps output mapping, inspect columns, software % rules)
        and the enum options used to build the editors. Restricted to
        admin / SLM / exec.
      responses:
        "200":
          description: Goals config and options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoalsConfigEnvelope"
  /sales/goals/config/role-group-mapping:
    put:
      operationId: updateGoalsRoleGroupMapping
      tags: [sales]
      summary: Replace the sales-role → group mapping
      description: Restricted to admin / SLM / exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: array
                  items:
                    $ref: "#/components/schemas/RoleGroupMapEntry"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: array
                    items:
                      $ref: "#/components/schemas/RoleGroupMapEntry"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/config/goal-csv-join-fields:
    put:
      operationId: updateGoalsGoalCsvJoinFields
      tags: [sales]
      summary: Replace the Goal CSV → hierarchy join fields
      description: Restricted to admin / SLM / exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: array
                  items:
                    $ref: "#/components/schemas/GoalCsvJoinField"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoalCsvJoinField"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/config/goal-csv-output-mapping:
    put:
      operationId: updateGoalsGoalCsvOutputMapping
      tags: [sales]
      summary: Replace the Goal CSV column → (metric, product) mapping
      description: Restricted to admin / SLM / exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: array
                  items:
                    $ref: "#/components/schemas/FinancePpsOutputMapEntry"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: array
                    items:
                      $ref: "#/components/schemas/FinancePpsOutputMapEntry"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/config/goal-csv-inspect-columns:
    put:
      operationId: updateGoalsGoalCsvInspectColumns
      tags: [sales]
      summary: Replace the Goal CSV inspect column selection
      description: Restricted to admin / SLM / exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [value]
                properties:
                  value:
                    type: array
                    items:
                      type: string
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/config/goal-csv-product-mapping:
    put:
      operationId: updateGoalsGoalCsvProductMapping
      tags: [sales]
      summary: Replace the Goal CSV Product column + per-product value mapping
      description: Restricted to admin / SLM / exec and blocked for view-only sessions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [productColumn, productValueMapping]
              properties:
                productColumn:
                  type: string
                productValueMapping:
                  type: array
                  items:
                    $ref: "#/components/schemas/GoalCsvProductValueEntry"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                required: [productColumn, productValueMapping]
                properties:
                  productColumn:
                    type: string
                  productValueMapping:
                    type: array
                    items:
                      $ref: "#/components/schemas/GoalCsvProductValueEntry"
        "400":
          $ref: "#/components/responses/GoalsValidationError"
  /sales/goals/config/finance-pps-join-fields:
    put:
      operationId: updateGoalsFinancePpsJoinFields
      tags: [sales]
