        - rep
        - oppName
        - accountId
        - accountName
        - slm
        - flm
        - region
        - segment
        - group
        - ruleNames
        - multipliers
        - lineItemCount
        - lineItems
        - rawMrr
        - excludedByAcqChurn
        - closeDate
      properties:
        oppId:
          type: string
        found:
          type: boolean
        compensableMrr:
          type: number
        closeDate:
          type: string
          description: |
            The opportunity's close date (M/D/YYYY), taken from the underlying
            parsed row's displayed close date. Shown in the "opps missing CPDs"
            table on the Anaplan tab.
        excludedByAcqChurn:
          type: boolean
          description: |
            True when at least one of this opp's line items was dropped by the
            Acquisition churn gate (see AnaplanLineItem.excludedByAcqChurn). The
            dropped lines contribute 0 to compensableMrr; the UI renders the opp
            red.
        acqChurnOverridden:
          type: boolean
          description: |
            True when at least one of this opp's line items bypassed the
            Acquisition churn gate via an "Ignore ACQ Churn Logic" adjustment
            (see AnaplanLineItem.acqChurnOverridden).
        product:
          type: string
        rep:
          type: string
        oppName:
          type: string
        accountId:
          type: string
        accountName:
          type: string
        slm:
          type: string
        flm:
          type: string
        region:
          type: string
        segment:
          type: string
        group:
          type: string
        sfContactId:
          type: string
        sfCpdId:
          type: string
        ruleNames:
          type: array
          items:
            type: string
        multipliers:
          type: array
          items:
            type: number
        lineItemCount:
          type: integer
        lineItems:
          type: array
          items:
            $ref: "#/components/schemas/AnaplanLineItem"
        rawMrr:
          $ref: "#/components/schemas/AnaplanRawMrr"
        pairOppName:
          type: string
          description: |
            Paired-opp rule metadata, mirroring the pipeline drilldown's pair
